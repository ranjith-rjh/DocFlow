<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DocFlow AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232f5bd3'/><path d='M10 7h9l5 5v13H10z' fill='white'/></svg>">
<style>
  /* Aucune ressource externe : l'interface fonctionne hors connexion (démo sans Wi-Fi). */
  :root {
    --fond: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --bord: #dfe3e8;
    --texte: #1b2230; --texte-2: #5b6576; --accent: #2f5bd3; --accent-doux: #e8eefc;
    --ok: #1e8a5a; --ok-doux: #e3f4ec; --attente: #a86a00; --attente-doux: #fbf1dd;
    --erreur: #c2372f; --erreur-doux: #fbe7e5; --ombre: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fond: #0f1218; --surface: #171b23; --surface-2: #1e232d; --bord: #2a313d;
      --texte: #e6e9ef; --texte-2: #9aa4b5; --accent: #7c9bff; --accent-doux: #1d2744;
      --ok: #4cc58f; --ok-doux: #15291f; --attente: #e0a73a; --attente-doux: #2b2312;
      --erreur: #ff7b72; --erreur-doux: #331917; --ombre: none;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--fond); color: var(--texte);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 920px; margin: 0 auto; padding: 32px 16px 64px; }

  header { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .marque { display: flex; align-items: center; gap: 12px; }
  .logo { width: 36px; height: 36px; border-radius: 9px; background: var(--accent); display: grid; place-items: center; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -.01em; }
  .sous-titre { color: var(--texte-2); font-size: 13px; margin: 0; }
  .sante { display: flex; gap: 6px; flex-wrap: wrap; }
  .pastille { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--bord); color: var(--texte-2); }
  .pastille::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--texte-2); }
  .pastille.ok::before { background: var(--ok); }
  .pastille.ko::before { background: var(--erreur); }

  /* ---- Zone de dépôt ---- */
  .depot {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    min-height: 210px; padding: 28px 16px; text-align: center; cursor: pointer;
    background: var(--surface); border: 2px dashed var(--bord); border-radius: 16px;
    transition: border-color .15s, background-color .15s, transform .15s;
  }
  .depot:hover, .depot:focus-visible { border-color: var(--accent); outline: none; }
  .depot.survol { border-color: var(--accent); background: var(--accent-doux); transform: scale(1.005); }
  .depot svg { color: var(--accent); }
  .depot strong { font-size: 17px; }
  .depot .aide { color: var(--texte-2); font-size: 13px; }
  .depot input { display: none; }
  .message { margin: 10px 2px 0; font-size: 13px; color: var(--erreur); min-height: 20px; }

  /* ---- Liste des traitements ---- */
  .titre-liste { display: flex; justify-content: space-between; align-items: baseline; margin: 28px 2px 12px; }
  h2 { font-size: 15px; margin: 0; }
  .titre-liste span { color: var(--texte-2); font-size: 13px; }
  .liste { display: grid; gap: 12px; }
  .vide { color: var(--texte-2); text-align: center; padding: 24px; border: 1px solid var(--bord); border-radius: 12px; background: var(--surface); }

  .carte { background: var(--surface); border: 1px solid var(--bord); border-radius: 14px; padding: 16px 18px; box-shadow: var(--ombre); }
  .entete { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .ident { min-width: 0; }
  .nom { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 52ch; }
  .id { font-family: var(--mono); font-size: 12px; color: var(--texte-2); }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; letter-spacing: .02em; }
  .badge.PENDING, .badge.PROCESSING { color: var(--attente); background: var(--attente-doux); }
  .badge.COMPLETED { color: var(--ok); background: var(--ok-doux); }
  .badge.FAILED { color: var(--erreur); background: var(--erreur-doux); }

  .etapes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 14px 0 4px; }
  .etape { font-size: 12px; color: var(--texte-2); }
  .etape .barre { height: 4px; border-radius: 4px; background: var(--surface-2); margin-bottom: 6px; overflow: hidden; }
  .etape.encours .barre { background: linear-gradient(90deg, var(--attente) 40%, var(--surface-2) 40%); background-size: 200% 100%; animation: defile 1.1s linear infinite; }
  .etape.faite .barre { background: var(--ok); }
  .etape.echec .barre { background: var(--erreur); }
  .etape.faite, .etape.encours { color: var(--texte); }
  .etape .duree { font-family: var(--mono); color: var(--texte-2); }
  @keyframes defile { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  @media (prefers-reduced-motion: reduce) { .etape.encours .barre { animation: none; background: var(--attente); } }

  .resultat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
  .champ { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .champ .etiquette { font-size: 12px; color: var(--texte-2); display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .champ .valeur { font-size: 18px; font-weight: 650; margin-top: 2px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .champ .valeur.absente { color: var(--texte-2); font-weight: 500; font-style: italic; font-size: 15px; }
  .puce { font-size: 10.5px; padding: 1px 6px; border-radius: 6px; background: var(--surface); border: 1px solid var(--bord); color: var(--texte-2); }
  .puce.incertain { color: var(--attente); border-color: var(--attente); }
  .pied { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 10px; font-size: 12px; color: var(--texte-2); }
  .pied a { color: var(--accent); text-decoration: none; }
  .erreur { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--erreur-doux); color: var(--erreur); font-size: 13px; }

  @media (max-width: 600px) {
    .resultat { grid-template-columns: 1fr; }
    .etapes { grid-template-columns: repeat(2, 1fr); }
    .nom { max-width: 26ch; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div class="marque">
      <div class="logo" aria-hidden="true">
        <svg width="18" height="20" viewBox="0 0 18 20" fill="none"><path d="M1 1h10l6 6v12H1z" fill="#fff"/><path d="M11 1v6h6" fill="#c9d6fb"/><path d="M4 11h10M4 14.5h7" stroke="#2f5bd3" stroke-width="1.6" stroke-linecap="round"/></svg>
      </div>
      <div>
        <h1>DocFlow AI</h1>
        <p class="sous-titre">Enseigne, date et total de vos tickets — trois microservices distribués</p>
      </div>
    </div>
    <div class="sante" aria-live="polite">
      <span class="pastille" id="sante-api">API</span>
      <span class="pastille" id="sante-base">PostgreSQL</span>
      <span class="pastille" id="sante-messagerie">RabbitMQ</span>
    </div>
  </header>

  <label class="depot" id="depot" tabindex="0" role="button" aria-describedby="aide-depot">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
    </svg>
    <strong>Glissez vos tickets ici</strong>
    <span class="aide" id="aide-depot">ou cliquez pour choisir · PDF, PNG ou JPEG · 10 Mo maximum · plusieurs fichiers acceptés</span>
    <input type="file" id="fichiers" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg" multiple>
  </label>
  <p class="message" id="message" role="alert"></p>

  <div class="titre-liste">
    <h2>Traitements</h2>
    <span id="compteur"></span>
  </div>
  <div class="liste" id="liste"><div class="vide">Aucun ticket pour l'instant.</div></div>
</main>

<script>
"use strict";
const ETAPES = [
  { cle: "recu", libelle: "Reçu" },
  { cle: "pretraitement", libelle: "Prétraitement · MS1" },
  { cle: "ocr", libelle: "OCR · MS2" },
  { cle: "extraction", libelle: "Extraction · MS3" },
];
const FIN_ETAPE = { "preprocessing.completed": "pretraitement", "ocr.completed": "ocr", "extraction.completed": "extraction" };
const TERMINAUX = new Set(["COMPLETED", "FAILED"]);
const LIBELLES_STATUT = { PENDING: "En attente", PROCESSING: "En cours", COMPLETED: "Terminé", FAILED: "Échec" };
const ENSEIGNES = { CARREFOUR: "Carrefour", LIDL: "Lidl", INTERMARCHE: "Intermarché", UNKNOWN: "Inconnue" };

const documents = new Map(); // document_id -> { nom, donnees }
const liste = document.getElementById("liste");
const message = document.getElementById("message");

// ------------------------------------------------------------------ dépôt
const zone = document.getElementById("depot");
const entree = document.getElementById("fichiers");
zone.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); entree.click(); } });
entree.addEventListener("change", () => { envoyer([...entree.files]); entree.value = ""; });
["dragenter", "dragover"].forEach((t) => zone.addEventListener(t, (e) => { e.preventDefault(); zone.classList.add("survol"); }));
["dragleave", "drop"].forEach((t) => zone.addEventListener(t, (e) => { e.preventDefault(); zone.classList.remove("survol"); }));
zone.addEventListener("drop", (e) => envoyer([...e.dataTransfer.files]));
// Évite que le navigateur ouvre le fichier si on le lâche à côté de la zone.
window.addEventListener("dragover", (e) => e.preventDefault());
window.addEventListener("drop", (e) => e.preventDefault());

async function envoyer(fichiers) {
  message.textContent = "";
  for (const fichier of fichiers) {
    const formulaire = new FormData();
    formulaire.append("fichier", fichier);
    try {
      const reponse = await fetch("/documents", { method: "POST", body: formulaire });
      const corps = await reponse.json().catch(() => ({}));
      if (!reponse.ok) { message.textContent = `${fichier.name} : ${corps.detail || "refusé (" + reponse.status + ")"}`; continue; }
      documents.set(corps.document_id, { nom: fichier.name, donnees: { document_id: corps.document_id, status: "PENDING", etapes: [] } });
      rendre();
      suivre(corps.document_id);
    } catch {
      message.textContent = `${fichier.name} : API injoignable`;
    }
  }
}

// ------------------------------------------------------------------ suivi
async function suivre(id) {
  try {
    const reponse = await fetch(`/documents/${id}`);
    if (reponse.ok) {
      documents.get(id).donnees = await reponse.json();
      rendre();
    }
  } catch { /* nouvel essai au tour suivant */ }
  // COMPLETED arrive juste avant la journalisation de la dernière étape :
  // on continue un instant pour afficher la durée de bout en bout.
  const d = documents.get(id).donnees;
  const fini = d.status === "FAILED" || (d.status === "COMPLETED" && d.duree_totale_ms != null);
  if (!fini) setTimeout(() => suivre(id), 700);
}

async function chargerHistorique() {
  try {
    const reponse = await fetch("/documents?limite=15");
    if (!reponse.ok) return;
    for (const d of (await reponse.json()).reverse()) {
      if (!documents.has(d.document_id)) {
        documents.set(d.document_id, { nom: null, donnees: { ...d, etapes: [] } });
        suivre(d.document_id);
      }
    }
    rendre();
  } catch { /* API indisponible : la pastille le signale */ }
}

async function verifierSante() {
  let etat = {};
  try { etat = await (await fetch("/health")).json(); } catch { etat = {}; }
  const maj = (id, ok) => { const el = document.getElementById(id); el.classList.toggle("ok", ok); el.classList.toggle("ko", !ok); };
  maj("sante-api", etat.api === "ok");
  maj("sante-base", etat.base === "ok");
  maj("sante-messagerie", etat.messagerie === "ok");
}

// ------------------------------------------------------------------ affichage
function etatsEtapes(d) {
  const etats = { recu: { etat: "faite" } };
  for (const e of d.etapes || []) {
    const details = e.details || {};
    if (e.event_type === "step.started") etats[details.etape] = { ...(etats[details.etape] || {}), etat: "encours", attente: e.attente_ms };
    if (FIN_ETAPE[e.event_type]) etats[FIN_ETAPE[e.event_type]] = { ...(etats[FIN_ETAPE[e.event_type]] || {}), etat: "faite", duree: e.duree_ms };
    if (e.event_type === "processing.failed") etats[details.etape] = { ...(etats[details.etape] || {}), etat: "echec" };
  }
  if (d.status === "COMPLETED") ETAPES.forEach((x) => { etats[x.cle] = { ...(etats[x.cle] || {}), etat: etats[x.cle]?.etat === "echec" ? "echec" : "faite" }; });
  return etats;
}

const echapper = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const formatDate = (iso) => iso ? new Date(iso + "T00:00:00").toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" }) : null;
const formatMontant = (m, devise) => m == null ? null : Number(m).toLocaleString("fr-FR", { style: "currency", currency: devise || "EUR" });

function champ(libelle, valeur, cle, r) {
  const methode = r.methode?.[cle];
  const incertain = (r.champs_incertains || []).includes(cle);
  const puces = [
    methode ? `<span class="puce">${methode === "modele" ? "modèle" : methode === "regles" ? "règles" : echapper(methode)}</span>` : "",
    incertain ? `<span class="puce incertain">incertain</span>` : "",
  ].join("");
  return `<div class="champ"><div class="etiquette">${libelle}${puces}</div>
    <div class="valeur ${valeur ? "" : "absente"}">${valeur ? echapper(valeur) : "non trouvé"}</div></div>`;
}

function carte(id, { nom, donnees: d }) {
  const etats = etatsEtapes(d);
  const barres = ETAPES.map((x) => {
    const e = etats[x.cle] || {};
    const duree = e.duree != null ? `<span class="duree"> ${e.duree} ms</span>` : "";
    return `<div class="etape ${e.etat || ""}"><div class="barre"></div>${x.libelle}${duree}</div>`;
  }).join("");
  const r = d.resultat;
  const resultat = r ? `<div class="resultat">
      ${champ("Enseigne", ENSEIGNES[r.entity] && r.entity !== "UNKNOWN" ? ENSEIGNES[r.entity] : null, "entity", r)}
      ${champ("Date du ticket", formatDate(r.date), "date", r)}
      ${champ("Total", formatMontant(r.total_amount, r.currency), "total_amount", r)}
    </div>` : "";
  const erreur = d.status === "FAILED" ? `<div class="erreur">${echapper(d.erreur || "Traitement interrompu")}</div>` : "";
  const pied = TERMINAUX.has(d.status) ? `<div class="pied">
      <span>${d.duree_totale_ms != null ? `Bout en bout : ${(d.duree_totale_ms / 1000).toFixed(2)} s` : ""}${r ? ` · ${echapper(r.version_modele)}` : ""}</span>
      <a href="/documents/${encodeURIComponent(id)}" target="_blank" rel="noopener">JSON</a></div>` : "";
  return `<article class="carte">
    <div class="entete">
      <div class="ident"><div class="nom">${echapper(nom || "Document déposé précédemment")}</div><div class="id">${echapper(id)}</div></div>
      <span class="badge ${echapper(d.status)}">${LIBELLES_STATUT[d.status] || echapper(d.status)}</span>
    </div>
    <div class="etapes">${barres}</div>${resultat}${erreur}${pied}
  </article>`;
}

function rendre() {
  const entrees = [...documents.entries()].reverse();
  document.getElementById("compteur").textContent = entrees.length ? `${entrees.length} document${entrees.length > 1 ? "s" : ""}` : "";
  liste.innerHTML = entrees.length ? entrees.map(([id, doc]) => carte(id, doc)).join("") : `<div class="vide">Aucun ticket pour l'instant.</div>`;
}

verifierSante();
setInterval(verifierSante, 10000);
chargerHistorique();
</script>
</body>
</html>
